<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">

    <!-- Logo -->
    <div class="flex items-center justify-center gap-2 mb-8">
      <img src="assets/images/logoQvenly.png" alt="Qvenly logo" class="h-8 w-auto">
      <span class="text-xl font-bold text-teal-500">Qvenly</span>
    </div>

    <!-- Título -->
    <h2 class="text-2xl font-bold text-gray-900 text-center mb-2">Recuperar Contraseña</h2>
    <p class="text-gray-500 text-sm text-center mb-8">Te enviaremos un enlace seguro a tu correo</p>

    <!-- Error -->
    <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-lg mb-4">
      {{ errorMessage }}
    </div>

    <!-- Éxito -->
    <div *ngIf="successMessage" class="bg-teal-50 border border-teal-200 text-teal-600 text-sm px-4 py-3 rounded-lg mb-4">
      {{ successMessage }}
    </div>

    <!-- Formulario -->
    <div class="flex flex-col gap-4">

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">Correo Electrónico</label>
        <input
          type="email"
          placeholder="tu@email.com"
          [(ngModel)]="email"
          name="email"
          class="border border-gray-300 rounded-lg px-4 py-3 text-sm outline-none focus:border-teal-500 transition-colors"/>
      </div>

      <button
        (click)="onSubmit()"
        [disabled]="isLoading"
        class="w-full bg-teal-500 text-white py-3 rounded-lg text-sm font-medium hover:bg-teal-600 transition-colors mt-2 disabled:opacity-50 disabled:cursor-not-allowed">
        {{ isLoading ? 'Enviando...' : 'Enviar Enlace' }}
      </button>

    </div>

    <!-- Volver -->
    <p class="text-center mt-6">
      <a routerLink="/auth/login" class="text-teal-500 text-sm font-medium hover:text-teal-600 transition-colors">
        Volver a Iniciar Sesión
      </a>
    </p>

  </div>
</div>
