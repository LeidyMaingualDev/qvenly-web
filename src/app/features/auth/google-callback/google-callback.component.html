<div class="min-h-screen bg-gray-50 flex items-center justify-center">
  <div class="text-center">
    <div *ngIf="!errorMessage">
      <div class="w-12 h-12 border-4 border-teal-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-gray-600 text-sm">Autenticando con Google...</p>
    </div>
    <div *ngIf="errorMessage" class="bg-red-50 border border-red-100 text-red-600 text-sm px-6 py-4 rounded-xl">
      {{ errorMessage }}
    </div>
  </div>
</div>
