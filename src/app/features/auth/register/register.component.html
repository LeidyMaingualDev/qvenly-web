<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">

    <!-- Logo -->
    <div class="flex items-center justify-center gap-2 mb-6">
      <img src="assets/images/logoQvenly.png" alt="Qvenly logo" class="h-8 w-auto">
      <span class="text-xl font-bold text-teal-500">Qvenly</span>
    </div>

    <!-- Título -->
    <h2 class="text-2xl font-bold text-gray-900 text-center mb-1">Registrarse</h2>
    <p class="text-gray-500 text-sm text-center mb-6">Crea tu cuenta en Qvenly</p>

    <!-- Error -->
    <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-lg mb-4">
      {{ errorMessage }}
    </div>

    <!-- Éxito -->
    <div *ngIf="successMessage"
      class="bg-green-50 border border-green-200 text-green-700 text-sm px-4 py-3 rounded-lg mb-4">
      {{ successMessage }}
    </div>

    <div *ngIf="successMessage" class="text-center mt-4">
      <a routerLink="/auth/login" class="text-teal-500 font-medium hover:text-teal-600 transition-colors text-sm">
        Ir al inicio de sesión
      </a>
    </div>

    <!-- Formulario -->
    <div *ngIf="!successMessage" class="flex flex-col gap-4">

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">Nombres</label>
        <input type="text" placeholder="Juan" [(ngModel)]="registerData.name" name="name"
          class="border border-gray-300 rounded-lg px-4 py-3 text-sm outline-none focus:border-teal-500 transition-colors" />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">Apellidos</label>
        <input type="text" placeholder="Pérez" [(ngModel)]="registerData.lastName" name="lastName"
          class="border border-gray-300 rounded-lg px-4 py-3 text-sm outline-none focus:border-teal-500 transition-colors" />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">Correo Electrónico</label>
        <input type="email" placeholder="tu@email.com" [(ngModel)]="registerData.email" name="email"
          class="border border-gray-300 rounded-lg px-4 py-3 text-sm outline-none focus:border-teal-500 transition-colors" />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">Tipo de Identificación</label>
        <select [(ngModel)]="registerData.documentType" name="documentType"
          class="border border-gray-300 rounded-lg px-4 py-3 text-sm outline-none focus:border-teal-500 transition-colors">
          <option value="CC">Cédula de Ciudadanía</option>
          <option value="CE">Cédula de Extranjería</option>
          <option value="PASSPORT">Pasaporte</option>
          <option value="TI">Tarjeta de Identidad</option>
        </select>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">Número de Identificación</label>
        <input type="text" placeholder="123456789" [(ngModel)]="registerData.documentNumber" name="documentNumber"
          class="border border-gray-300 rounded-lg px-4 py-3 text-sm outline-none focus:border-teal-500 transition-colors" />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">Número de Teléfono</label>
        <input type="tel" placeholder="+573001234567" [(ngModel)]="registerData.phoneNumber" name="phoneNumber"
          class="border border-gray-300 rounded-lg px-4 py-3 text-sm outline-none focus:border-teal-500 transition-colors" />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700">Contraseña <span class="text-gray-400 font-normal">(mín. 8
            caracteres, incluir mayúsculas y números)</span></label>
        <input type="password" placeholder="••••••••" [(ngModel)]="registerData.password" name="password"
          class="border border-gray-300 rounded-lg px-4 py-3 text-sm outline-none focus:border-teal-500 transition-colors" />
      </div>

      <button (click)="onSubmit()" [disabled]="isLoading"
        class="w-full bg-teal-500 text-white py-3 rounded-lg text-sm font-medium hover:bg-teal-600 transition-colors mt-2 disabled:opacity-50 disabled:cursor-not-allowed">
        {{ isLoading ? 'Creando cuenta...' : 'Crear Cuenta' }}
      </button>

    </div>

    <!-- Login -->
    <p class="text-center text-sm text-gray-500 mt-6">
      ¿Ya tienes cuenta?
      <a routerLink="/auth/login" class="text-teal-500 font-medium hover:text-teal-600 transition-colors">Iniciar
        Sesión</a>
    </p>

  </div>
</div>
