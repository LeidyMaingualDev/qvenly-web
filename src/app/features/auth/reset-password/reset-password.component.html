<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">

        <!-- Logo -->
        <div class="flex items-center justify-center gap-2 mb-8">
            <img src="assets/images/logoQvenly.png" alt="Qvenly logo" class="h-8 w-auto">
            <span class="text-xl font-bold text-teal-500">Qvenly</span>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">

            <div class="mb-8">
                <h2 class="text-2xl font-bold text-gray-900 mb-1">Restablecer contraseña</h2>
                <p class="text-gray-500 text-sm">Ingresa tu nueva contraseña para continuar.</p>
            </div>

            <!-- Error -->
            <div *ngIf="errorMessage"
                class="bg-red-50 border border-red-100 text-red-600 text-sm px-4 py-3 rounded-xl mb-6">
                {{ errorMessage }}
            </div>

            <!-- Éxito -->
            <div *ngIf="successMessage"
                class="bg-teal-50 border border-teal-100 text-teal-600 text-sm px-4 py-3 rounded-xl mb-6">
                {{ successMessage }} Redirigiendo al login...
            </div>

            <div class="flex flex-col gap-5">

                <div class="flex flex-col gap-1.5">
                    <label class="text-sm font-medium text-gray-700">
                        Nueva contraseña
                        <span class="text-gray-400 font-normal">(mín. 8 caracteres, incluir mayúsculas y números)</span>
                    </label>
                    <input type="password" placeholder="••••••••" [(ngModel)]="newPassword" name="newPassword"
                        class="border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-50 transition-all" />
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-sm font-medium text-gray-700">Confirmar contraseña</label>
                    <input type="password" placeholder="••••••••" [(ngModel)]="confirmPassword" name="confirmPassword"
                        class="border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-50 transition-all" />
                </div>

                <button (click)="onSubmit()" [disabled]="isLoading || !token"
                    class="w-full bg-teal-500 text-white py-3 rounded-xl text-sm font-semibold hover:bg-teal-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    {{ isLoading ? 'Restableciendo...' : 'Restablecer contraseña' }}
                </button>

            </div>

            <p class="text-center mt-6">
                <a routerLink="/auth/login"
                    class="text-teal-500 text-sm font-medium hover:text-teal-600 transition-colors">
                    Volver a Iniciar Sesión
                </a>
            </p>

        </div>
    </div>
</div>
