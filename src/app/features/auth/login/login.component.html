<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">

        <!-- Logo -->
        <div class="flex items-center justify-center gap-2 mb-8">
            <img src="assets/images/logoQvenly.png" alt="Qvenly logo" class="h-8 w-auto">
            <span class="text-xl font-bold text-teal-500">Qvenly</span>
        </div>

        <!-- Título -->
        <h2 class="text-2xl font-bold text-gray-900 text-center mb-2">Iniciar Sesión</h2>
        <p class="text-gray-500 text-sm text-center mb-8">Accede a tu cuenta para gestionar tus eventos</p>

        <!-- Formulario -->
        <div class="flex flex-col gap-4">

            <div class="flex flex-col gap-1">
                <label class="text-sm font-medium text-gray-700">Correo electrónico</label>
                <input type="email" placeholder="tucorreo@ejemplo.com"
                    class="border border-gray-300 rounded-lg px-4 py-3 text-sm outline-none focus:border-teal-500 transition-colors" />
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-sm font-medium text-gray-700">Contraseña</label>
                <input type="password" placeholder="••••••••"
                    class="border border-gray-300 rounded-lg px-4 py-3 text-sm outline-none focus:border-teal-500 transition-colors" />
            </div>

            <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                    <input type="checkbox" class="accent-teal-500" />
                    Recordarme
                </label>
                <a routerLink="/auth/forgot-password"
                    class="text-sm text-teal-500 hover:text-teal-600 transition-colors">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>

            <button
                class="w-full bg-teal-500 text-white py-3 rounded-lg text-sm font-medium hover:bg-teal-600 transition-colors mt-2">
                Iniciar Sesión
            </button>

        </div>

        <!-- Divider -->
        <div class="flex items-center gap-4 my-6">
            <div class="flex-1 h-px bg-gray-200"></div>
            <span class="text-xs text-gray-400">o continúa con</span>
            <div class="flex-1 h-px bg-gray-200"></div>
        </div>
